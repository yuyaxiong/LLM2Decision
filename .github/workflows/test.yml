name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # Runs first and on its own: a leaked key is worse than a failing build. The committed
      # example files (.env.example, *.yaml.example) are outside .gitignore by design, so a
      # real key pasted into one of them would go public.
      - name: Guard against committed credentials
        run: python3 scripts/check_no_secrets.py

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is fully offline and needs no API key — see README "Tests".
      - name: Run tests
        run: pytest -q

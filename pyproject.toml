[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm2decision"
version = "0.1.0"
description = "Turn any hosted LLM into a typed decision model — get probabilities over your options instead of generated text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yuyaxiong" }]
keywords = [
    "llm", "decision-model", "typed-decision-model", "logprobs", "classification",
    "routing", "guardrails", "structured-output", "hallucination",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/yuyaxiong/LLM2Decision"
Issues = "https://github.com/yuyaxiong/LLM2Decision/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm2decision = ["prompts/templates/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
